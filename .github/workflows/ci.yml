# CI (Phase D, 2026-07-22; extended W4, 2026-07-29): lint, types, tests,
# secret scan, dependency CVEs, backup drill.
# The suite is fully offline by design (no secrets configured here, ever).
name: ci
on:
  push:            # every branch — this was `branches: [main]`, so a pushed
                   # feature branch went unchecked until a PR was opened
  pull_request:

# A newer push supersedes the previous run for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 = FULL history, and the secret scan below depends on
          # it. The default is a shallow clone of depth 1, under which
          # `gitleaks git` sees exactly one commit — so a credential committed
          # and deleted later would pass, which is the specific case history
          # mode exists to catch.
          #
          # Measured, not assumed (2026-08-06). A 4-commit repo with a fake AWS
          # key added in c2 and deleted in c3:
          #   shallow clone (depth 1) -> 1 commit visible  -> gitleaks exit 0, MISSED
          #   full clone    (depth 0) -> 4 commits visible -> gitleaks exit 1, CAUGHT
          # So without this line the step would have been green, permanent, and
          # its own comment would have been false.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        # requirements.lock is the reproducible install (W4-1): direct pins
        # PLUS the transitive closure, including numpy and pandas — which
        # nothing in requirements.txt names and on which every gate verdict's
        # arithmetic rests. Installing the loose files here would leave CI
        # resolving differently from production on any given day.
        run: |
          pip install -r requirements.lock
          pip install -r requirements-dev.txt      # the pinned pytest, not a floating one
          pip install pip-audit

      # ---- lint and types -------------------------------------------------
      - name: Lint (ruff)
        # BLOCKING, on a deliberately narrow rule set — see pyproject.toml for
        # the enabled families, the measured counts of every deferred family,
        # and why. Zero findings today, so this only ever fires on a
        # regression.
        run: ruff check src/ scripts/ tests/

      - name: Types (mypy, advisory)
        # NOT blocking, and scoped to the four pure-logic modules where a type
        # error would corrupt a number rather than crash a cycle. 28 findings
        # today, reviewed: the one in the sizing path (risk.py:322) is a false
        # positive — `_risk_sizing_active` returns False on a falsy stop_price,
        # which mypy cannot narrow through a helper. Do not "fix" it.
        continue-on-error: true
        run: mypy src/risk.py src/gatespec.py src/judge_model.py src/significance.py

      # ---- security -------------------------------------------------------
      #
      # NO SECRET-EXPOSURE STEP HERE, DELIBERATELY (W4-5, 2026-07-29).
      #
      # The W4 plan called for `scripts/check_secret_exposure.py` to run here as
      # a blocking step. Measured before shipping it: that would have been a
      # check that CAN NEVER FAIL.
      #
      # The script reads `.env` and searches `~/.claude/projects/*/*.jsonl`.
      # Neither exists on a CI runner — `.env` is gitignored and never checked
      # out — so it prints "No credentials found in .env — nothing to check"
      # and returns 0 unconditionally. A green step proving nothing is worse
      # than no step, because it reads as coverage.
      #
      # It is a LOCAL-MACHINE hygiene tool: it answers "is a live secret sitting
      # in plaintext on this laptop?", which is a question about this laptop.
      # Its home is the weekly launchd job (com.trading-agent.secretcheck).
      #
      # A CI secret scan is a genuinely different tool — one that scans the REPO
      # for committed credentials (gitleaks/trufflehog shape). The step below is
      # that tool. This comment stays, because the DISTINCTION is the point and
      # because the local checker still has no home here.
      - name: Repo secret scan (gitleaks) — BLOCKING
        # Fills the gap the comment above recorded on 2026-07-29.
        #
        # `git` mode, not `dir` mode, and the difference is the whole value: a
        # credential committed and deleted three commits later is invisible to a
        # working-tree scan and is exactly as leaked as one still present. This
        # walks all history.
        #
        # BASELINE, measured before wiring it up (2026-08-06, gitleaks 8.30.1):
        # 196 commits / 4.82 MB / ZERO findings. The working tree has 5, every
        # one in a gitignored file that never reaches a runner — four in `.env`,
        # which is that file's job, and one in a __pycache__ .pyc of the secret
        # checker's own test FIXTURE. So this starts green on a genuinely clean
        # history, rather than arriving pre-failing and being suppressed.
        #
        # PROVEN TO FAIL (before / while-mutated / after, against a clone of
        # this repo): clean history exit 0 -> commit carrying a fake AWS key id
        # and Slack bot token exit 1 -> probe commit dropped exit 0.
        #
        # The first probe SURVIVED and the reason is worth keeping: it used
        # AWS's canonical *documentation* key id — the one that appears in their
        # published examples — which gitleaks allowlists on purpose. It scanned
        # 197 commits and reported nothing. A probe built from a vendor's own
        # example value proves nothing; use a fake that is merely well-formed.
        #
        # That literal value is deliberately NOT written here, and the reason is
        # itself a finding: writing it into this comment made
        # `tests/test_secrets_hygiene.py::test_no_secret_shapes_in_tracked_files`
        # fail, because its `AKIA[0-9A-Z]{16}` pattern has no allowlist. So the
        # two scanners are NOT redundant — on this exact string the local
        # shape test is the stricter of the two, and gitleaks is the one that
        # sees history. Keep both.
        #
        # Pinned by version, same reasoning as requirements.lock: a floating
        # `@latest` action would change what this gate means with no commit.
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --no-banner --redact --exit-code 1 .

      - name: Dependency CVE scan — advisory (all severities)
        # Every finding, visible, non-blocking. Runs against the lockfile, so
        # it finally covers transitive packages rather than the 12 direct ones.
        continue-on-error: true
        run: pip-audit -r requirements.lock

      - name: Dependency CVE scan — BLOCKING on HIGH/CRITICAL
        # W4-4. The advisory pass above was the ONLY scan until now, so a HIGH
        # CVE scrolled past in a green build. This one fails the build.
        # Kept as a second invocation rather than replacing the first: the
        # advisory pass still surfaces MEDIUM and LOW, which are worth seeing
        # without freezing development.
        run: |
          pip-audit -r requirements.lock --format json > audit.json || true
          python - <<'PY'
          import json, sys
          data = json.load(open("audit.json"))
          deps = data.get("dependencies", data) if isinstance(data, dict) else data
          bad = []
          for dep in deps:
              for v in dep.get("vulns", []) or []:
                  sev = str(v.get("severity") or "").upper()
                  # pip-audit does not always carry a severity; when it is
                  # absent we do NOT guess. An unrated CVE is reported by the
                  # advisory pass and does not block here, because inventing a
                  # severity would make this gate unfalsifiable.
                  if sev in ("HIGH", "CRITICAL"):
                      bad.append(f"{dep.get('name')} {dep.get('version')}: "
                                 f"{v.get('id')} [{sev}]")
          if bad:
              print("BLOCKING — HIGH/CRITICAL advisories:")
              for b in bad:
                  print("  " + b)
              sys.exit(1)
          print("no HIGH/CRITICAL advisories")
          PY

      # ---- tests ----------------------------------------------------------
      - name: Tests (offline)
        run: python -m pytest tests/ -q

      - name: Backup + restore drill (smoke)
        # A backup that has never been restored is a hope, not a backup — prove
        # the round trip here too, not only on the weekly scheduled job.
        run: |
          mkdir -p memory
          printf '{"type":"event","event":"ci"}\n' > memory/ledger.jsonl
          sh scripts/backup.sh backups
          python scripts/restore_drill.py
