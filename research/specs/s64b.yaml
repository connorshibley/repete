# §64b — trend_hold levered switch on SPY (2007-2013)
#
# SIXTEEN SPECS IN ONE REGISTRATION. s64a-e, s65a-d, s66a-d and s67a-c are
# written and frozen TOGETHER, before any is run (the §41/§57/§62 convention).
# Design, priors, reading rules and the promotion route were frozen FIRST in
# research/specs/drafts/s64-wave-design.md (commit 0b0b08a), before any code
# in this wave existed. Dossier: research/candidates_2026-08.md.
#
# DIAGNOSTIC on data/pit/, which is EDGE-frozen by §57's own reading rule.
# These specs spend no Bonferroni budget and can enable nothing; s64/s65
# carry a pre-committed PROMOTION rule in `prior` that is the only path to
# an EDGE registration, via the audited --override-freeze supersession
# argument drafted in the wave-design doc BEFORE any run.
#
# judge_model FALSE, argued here rather than assumed: these are mechanical
# single-instrument (or three-fund) calendar/threshold switches with no
# judgeable per-trade thesis. §57 declared true for the ensemble question —
# a different question. Declaring false here is a pre-registered choice, not
# an omission.
#
# EVERY LEVERED ARM PAYS FINANCING: aux rate_bars (^IRX, a market print that
# is never revised) + 150bps, failing CLOSED to a punitive 6% flat — so no
# number here is comparable to published figures that assumed a 1% borrow.
# Shipped rails stay ON (regime cap, drawdown latch) exactly as §62 kept
# them: the candidate is measured inside the bot it would actually live in,
# and the block census reports what bound.
#
# SIZING OVERLAYS ARE IDENTICAL ACROSS ARMS (risk_per_trade 400 / position
# 400 / heat 10000): buying power is what binds, so the ONLY difference
# between baseline and a levered arm is risk.margin.multiplier — leverage is
# attributable the way §53's three-arm design made the short leg attributable.
#
# s64: trend_hold (Gayed-Bilello 200-DMA switch) alone on SPY. Candidate
# arm is lev150 (the default-second rule); lev125 runs and reports for
# attribution but gates nothing. Baseline is the unlevered switch.
id: s64b
claim: DIAGNOSTIC
title: "trend_hold levered switch on SPY (2007-2013)"

judge_model: false

snapshot:
  path: data/pit/bars_etf_2007-01-01_2013-12-31.json.gz
  sha256: 37e2609b8515998a54729a476ab1a39778e1db9fd0bca6c27992b2972bebc29a

aux:
  rate_bars:
    path: data/aux/irx_2000-01-01_2026-08-11.json.gz
    sha256: 44c3f3f580c0d61574499732dd46bea3655b92877efbc3ec343ff15d1507aade

cash: 100000.0
bonferroni_k: 15

arms:
  - name: baseline
    replace:
      symbols:
        - SPY
    set:
      strategies.ma_crossover.enabled: false
      strategies.tsmom.enabled: false
      strategies.meanrev.enabled: false
      strategies.trend_hold.enabled: true
      risk.risk_per_trade_pct: 400.0
      risk.max_position_pct: 400.0
      risk.max_portfolio_heat_pct: 10000.0
      risk.margin.multiplier: 1.0
  - name: lev150
    replace:
      symbols:
        - SPY
    set:
      strategies.ma_crossover.enabled: false
      strategies.tsmom.enabled: false
      strategies.meanrev.enabled: false
      strategies.trend_hold.enabled: true
      risk.risk_per_trade_pct: 400.0
      risk.max_position_pct: 400.0
      risk.max_portfolio_heat_pct: 10000.0
      risk.margin.multiplier: 1.5
  - name: lev125
    replace:
      symbols:
        - SPY
    set:
      strategies.ma_crossover.enabled: false
      strategies.tsmom.enabled: false
      strategies.meanrev.enabled: false
      strategies.trend_hold.enabled: true
      risk.risk_per_trade_pct: 400.0
      risk.max_position_pct: 400.0
      risk.max_portfolio_heat_pct: 10000.0
      risk.margin.multiplier: 1.25

clauses:
  - {id: a, rule: min_trades, n: 8}
  - {id: b, rule: beats_benchmark_symbol, symbol: SPY}
  - {id: d, rule: beats_benchmark_risk_adjusted, symbol: SPY}

prior: >-
  Expected outcome, frozen: the 2016-2026 replication at 1.5x with honest
  financing TRAILED SPY TR by ~2.2pp/yr, so clause (b) is expected to FAIL
  in the grind-up period (c) and pass at most in bear-containing windows;
  the risk-adjusted clause (d) is the likely pass. McLean-Pontiff leaves
  ~1.4pp of the in-sample edge before financing. READING RULE across s64a-d,
  committed before any run: (1) clause (b) beats_benchmark_symbol passing on
  the lev150 candidate in 3 or more of the 4 periods AND s64e showing no
  interior optimum licenses exactly ONE EDGE registration for this candidate
  at K=16 via the supersession route in the wave-design doc — and nothing
  else does; (2) 2 of 4 resolves regime-dependent: recorded, no EDGE, may
  inform ONE future combined spec; (3) 1 or fewer of 4 closes the candidate
  for this programme; (4) risk-adjusted-only passes license a note, never a
  promotion — the owner's bar is total return; (5) any other split is
  INDETERMINATE and licenses nothing.

failure_modes:
  - >-
    GAP-THROUGH: signal on close, fill next open — Feb 2018, Mar 2020 and Apr
    2025 all gapped through the MA, and the simulator eats the gap the way
    live would.
  - >-
    SAMPLE-START FLATTERY: the published result leans on 1929-shaped
    catastrophes and retroactively cheap leverage; the four fixed periods
    contain two big bears, which flatters the switch relative to its forward
    expectation in grinding bulls.
  - >-
    WHIPSAW CLUSTERS: 22 MA crosses Jan 2022 - Mar 2023 alone; slippage is
    5bps per side but the switch's real cost is re-entering higher, which no
    cost model shows separately.
  - >-
    RAILS ON: the shipped regime cap and drawdown latch remain enabled; a FAIL
    must be read against the block census before it is read as the strategy
    failing (the s53 97-99pc-blocked precedent).
  - >-
    FEW INDEPENDENT BETS: a regime switch makes one to three calls per period;
    four periods is a handful of episodes, not a distribution (the s48/s49
    trap, pre-acknowledged).
