prior: >-
  THE PERIOD THE PROMOTION RULE WEIGHTS MOST. Unemployment rose from 4.4%
  in early 2007 to 10.0% in October 2009 and did NOT fall back below its
  own trailing 252-day mean until well after that — the textbook case that
  labor is a LAGGING indicator. Equities bottomed in March 2009 and began a
  monster rally through 2009-2010 WHILE unemployment kept climbing to its
  own October 2009 peak. §72's confirmed EDGE pass draws real weight from
  this exact window.

  STATED PLAINLY, NOT HEDGED: this is the period where the gate is most
  likely to HURT, not help. If macro_on blocks trend_hold's 200-DMA
  re-entry signal in spring/summer 2009 because UNRATE is still elevated
  relative to its own trailing mean, it removes the single highest-value
  trade in the entire four-period dataset — the same trade that gives
  baseline its strongest evidence. That is the specific, falsifiable,
  unfavorable prediction for this spec, not a generic risk disclosure.

  READING RULE — identical language to s73a, repeated here because this is
  the period it names explicitly: (b) passing in 3 or more of 4 periods
  licenses one future EDGE registration via audited override, K 16 -> 17 at
  that spend and not before; 2 of 4 is regime-dependent, recorded, no
  promotion; 1 or fewer, OR a clear reversal specifically HERE (2007-2013),
  REFUTES the mechanism for trend_hold and closes the family — the same
  standard applied to GEM, tom_tilt and vol_lever.

failure_modes:
  - >-
    THE GATE CAN ONLY REMOVE, NEVER ADD, an entry — see s73a.
  - >-
    LABOR LAGS THE MARKET — this file's central risk, stated in the prior
    above rather than here, because it is not a generic disclosure for this
    period; it is the specific mechanism under test.
  - >-
    FEW INDEPENDENT EPISODES: same s48/s49 caveat as every prior wave.
  - >-
    LATCH OFF IS NOT SHIPPABLE AS-IS, REMAINING RAILS STAY ON, and
    GAP-THROUGH/financing realism carry over from s64/s68/s72 verbatim.
  - >-
    THE AUX IS A MON-FRI STEP SERIES, NOT A TRUE NYSE CALENDAR — see s73a.
