# §48d — IS THERE SIGNAL AT FULL DEPLOYMENT? (2022-2026)
#
# One of four. s48a-d are written and frozen TOGETHER before any is run; see
# s48a.yaml for the full reasoning.
#
# THIS IS THE MOST IMPORTANT OF THE FOUR, for two reasons.
#
# It is the most strangled period on record: §40 measured 245,213 signals ->
# TWENTY-NINE executions (0.01%), 92.4% of bars fully in cash, and the drawdown
# rail blocking 99.43% of every buy signal. Whatever the strategies do here,
# the shipped configuration has essentially never seen it.
#
# It is also the period closest to the current regime, and §45 recorded that
# fact as divergence #13: live's drawdown is ~1% against a 10% rail, so the
# live bot is currently trading in the ~3% of the time the latch is quiet.
# "The live track record is not being drawn from the same distribution as the
# backtest. Its first fifteen days are the honeymoon before the latch engages."
# This spec measures the other 97% for the first time.
#
# NOT A FIX. `risk.max_drawdown_pct: 0` is the control condition, not a
# proposal. census.py's rule governs: "loosening a risk rail because a
# diagnostic suggested it is exactly the unfalsifiable move this whole
# programme exists to prevent."
id: s48d
claim: DIAGNOSTIC
title: "Is there signal at full deployment? Drawdown rail present vs absent (2022-2026)"

judge_model: true

snapshot:
  path: data/snapshots/bars_wide_2022-01-01_2026-07-24.json.gz
  sha256: 081dc08727a8cd8e1dc4726625b1fab02cb3b7d8c1489849a69327950c4adc8d

cash: 100000.0

# K=13 for comparability. THE COUNT DOES NOT RISE — a DIAGNOSTIC spends no
# multiple-comparisons budget because it cannot produce a PASS that licenses
# anything.
bonferroni_k: 13

arms:
  - name: baseline          # the SHIPPED configuration, unmodified

  - name: no_drawdown_rail
    set:
      risk.max_drawdown_pct: 0

clauses:
  - {id: a, rule: deployment_at_least, pct: 25}
  - {id: b, rule: beats_exposure_matched}
  - {id: c, rule: min_trades, n: 30}

prior: >-
  The baseline arm is expected to FAIL clause (c) outright — §45 counted 54
  closed trades here under a judge-on run and §40 counted 29 executions, so 30
  is close to the boundary and may fall either side depending on how the run
  terminates. That is itself worth having on the record: the control condition
  in the period closest to today may not clear a minimum-trades bar that exists
  to stop noise being read as signal.

  The unblocked arm is expected to clear (a) and (c) easily — removing the
  constraint that blocked 99.43% of signals must raise deployment and trade
  count, and that part is arithmetic rather than a finding. Clause (b) is the
  one that carries information, and the base rate says it fails: EDGE stands at
  0 for 13, and there is no reason removing a risk rail would create predictive
  power that was not there.

  THE READING RULE, COMMITTED BEFORE THE RUN, so that the outcome cannot select
  the experiment — the §46 trap, and the mistake §44's revised prior made.
  Across s48a-d taken together:

  (1) If the unblocked arm FAILS clause (b) in two or more of the four periods,
  then the strategies have no expressible edge on this universe even when fully
  deployed. The ambiguity census.py named resolves against the strategies, the
  0-for-13 record is confirmed rather than confounded, and this licenses NO
  further EDGE registration on this universe — specifically, the drafted
  volatility-targeting spec is not registered.

  (2) If the unblocked arm CLEARS clause (b) in three or more periods, the
  ambiguity resolves the other way: the rail was masking measurement, and some
  share of the thirteen rejections were scoring a bot that was in cash. That
  licenses exactly one thing — a fresh EDGE registration re-testing the
  INCUMBENT at full deployment, spending budget as K=14. It does not license
  new machinery, and it does not license touching max_drawdown_pct.

  (3) Any other split is INDETERMINATE and licenses nothing. Saying so now is
  the point; a rule that resolves every possible outcome into a green light is
  not a rule.

  Either resolution is worth having. (1) is the more likely and is the more
  valuable of the two, because it converts "we do not know whether there is an
  edge" into "we know there is not", which is the first thing this project
  could act on decisively.

failure_modes:
  - >-
    THE UNBLOCKED ARM WILL HAVE FAR WORSE DRAWDOWN, BY CONSTRUCTION, and this
    period contains the 2022 bear market. That is arithmetic, not a finding,
    and it is not an argument against the rail. The drawdown rail exists
    because the owner has a stated 10pp tolerance. Nothing in this diagnostic
    weighs return against that tolerance, and a reader who takes "the unblocked
    arm returned more" as "remove the rail" has drawn the exact conclusion
    census.py forbids.
  - >-
    CLAUSE (b) IS NEARLY MEANINGLESS ON THE BASELINE ARM, which runs the
    SHIPPED config — and more so here than anywhere. beats_exposure_matched
    compares return against buy-and-hold
    SCALED BY DEPLOYMENT; at 92.4% cash the benchmark is scaled to almost
    nothing and a single winning trade could clear it. Combined with the
    expected (c) failure, the baseline arm's clause results in this period
    should be treated as uninformative rather than as a control that passed.
  - >-
    THIS PERIOD IS THE ONE MOST LIKELY TO BE READ AS BEARING ON LIVE, and it
    does not. §45 recorded divergence #13 precisely because live is currently
    in the quiet-latch regime that this period says is ~3% of the time. A
    result here describes the backtest distribution, and live's fifteen days
    are not a sample from it. Neither arm here predicts what the live bot will
    do next month.
  - >-
    SURVIVORSHIP, inherited from §41/§44: the universe is built from today's
    index membership, so the period excludes names that later failed. This
    flatters any long strategy and flatters the HIGHER-DEPLOYMENT arm more,
    biasing clause (b) toward the more permissive reading.
  - >-
    A CLEAN RESULT UNDER (2) IS STILL NOT AN EDGE. It would say the previous
    measurements were confounded, not that the strategies work. The thirteen
    rejections are not withdrawn, re-scored or revisited by anything here —
    §41 set that precedent explicitly when its own simulator finding could have
    been used to reopen ten verdicts, and it reopened none.
  - >-
    ONE PERIOD IS NOT THE CLAIM. s48a-d are read together under the rule in
    `prior`. A striking result in this period alone is a period-selection story,
    which is the failure §37 and §44 were both structured to avoid.
