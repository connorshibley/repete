# §67a — gem dual momentum, book spec (2007-2013)
#
# SIXTEEN SPECS IN ONE REGISTRATION. s64a-e, s65a-d, s66a-d and s67a-c are
# written and frozen TOGETHER, before any is run (the §41/§57/§62 convention).
# Design, priors, reading rules and the promotion route were frozen FIRST in
# research/specs/drafts/s64-wave-design.md (commit 0b0b08a), before any code
# in this wave existed. Dossier: research/candidates_2026-08.md.
#
# DIAGNOSTIC on data/pit/, which is EDGE-frozen by §57's own reading rule.
# These specs spend no Bonferroni budget and can enable nothing; s64/s65
# carry a pre-committed PROMOTION rule in `prior` that is the only path to
# an EDGE registration, via the audited --override-freeze supersession
# argument drafted in the wave-design doc BEFORE any run.
#
# judge_model FALSE, argued here rather than assumed: these are mechanical
# single-instrument (or three-fund) calendar/threshold switches with no
# judgeable per-trade thesis. §57 declared true for the ensemble question —
# a different question. Declaring false here is a pre-registered choice, not
# an omission.
#
# EVERY LEVERED ARM PAYS FINANCING: aux rate_bars (^IRX, a market print that
# is never revised) + 150bps, failing CLOSED to a punitive 6% flat — so no
# number here is comparable to published figures that assumed a 1% borrow.
# Shipped rails stay ON (regime cap, drawdown latch) exactly as §62 kept
# them: the candidate is measured inside the bot it would actually live in,
# and the block census reports what bound.
#
# SIZING OVERLAYS ARE IDENTICAL ACROSS ARMS (risk_per_trade 400 / position
# 400 / heat 10000): buying power is what binds, so the ONLY difference
# between baseline and a levered arm is risk.margin.multiplier — leverage is
# attributable the way §53's three-arm design made the short leg attributable.
#
# s67: gem — Antonacci's book spec, one arm named baseline (the s39
# single-arm contract: the configuration itself on trial). Registered
# to be falsified; see prior.
id: s67a
claim: DIAGNOSTIC
title: "gem dual momentum, book spec (2007-2013)"

judge_model: false

snapshot:
  path: data/pit/bars_2007-01-01_2013-12-31.json.gz
  sha256: 9a0160ab426473b169e6239c4189f0da41222e965406b9adcae57f226f054af5

aux:
  rate_bars:
    path: data/aux/irx_2000-01-01_2026-08-11.json.gz
    sha256: 44c3f3f580c0d61574499732dd46bea3655b92877efbc3ec343ff15d1507aade

cash: 100000.0
bonferroni_k: 15

arms:
  - name: baseline
    replace:
      symbols:
        - SPY
        - EFA
        - AGG
    set:
      strategies.ma_crossover.enabled: false
      strategies.tsmom.enabled: false
      strategies.meanrev.enabled: false
      strategies.gem.enabled: true
      risk.risk_per_trade_pct: 400.0
      risk.max_position_pct: 400.0
      risk.max_portfolio_heat_pct: 10000.0
      risk.margin.multiplier: 1.0

clauses:
  - {id: a, rule: min_trades, n: 5}
  - {id: b, rule: beats_benchmark_symbol, symbol: SPY}
  - {id: d, rule: beats_benchmark_risk_adjusted, symbol: SPY}

prior: >-
  A FALSIFICATION REGISTRATION. Tracked post-publication record: 8.4 pct
  CAGR vs SPY 13.6 (2014-2026); 2022 the haven leg (AGG -13pc) failed it;
  ReSolve's 1,226-specification study shows the book's 12-month lookback is
  luck-indistinguishable from its siblings, which is why there is ONE arm
  and NO grid. Expected: FAILS clause (b) in periods b and c; period a
  (2007-2013, the long bear) is its one structurally favorable window.
  READING RULE across s67a-c, committed before any run: (1) clause (b)
  failing in 2 or more of 3 periods CLOSES the dual-momentum family in this
  repo — future GEM-shaped proposals get this section as the one-paragraph
  answer; (2) passing in 2 or more of 3 is surprising, licenses NOTHING by
  itself, and reopens the family for one properly-powered future
  registration; (3) no outcome licenses an EDGE registration from this spec.
  2000-2006 is deliberately absent: EFA and AGG did not exist; a period the
  legs cannot trade is not stretched (the s53 degenerate-period precedent
  cuts the other way when the instrument itself is missing).

failure_modes:
  - >-
    THE CASH FILTER IS ^IRX-DERIVED: T-bill return accrued from daily
    annualized prints, not a fund's adjusted closes; BIL was rejected for
    inception (2007) and ZIRP-era expense drag. A different threshold
    construction is a different spec.
  - >-
    EFA AS THE SOLE INTL LEG: the book's ACWI-ex-US is proxied by developed-
    ex-US; emerging markets are absent. This tracks most public replications
    but is a declared narrowing.
  - >-
    MONTHLY ROTATION, HANDFUL OF SWITCHES: ~1.7 trades/yr tracked; min_trades
    n 5 per period is argued from that.
  - >-
    THE SIMULATOR HOLDS ONE LEG VIA max_open_positions 1; a month where the
    exit fills but the entry is blocked by a rail leaves the book flat for a
    month — live would too, but the block census must be read.
