# SIXTEEN SPECS IN ONE REGISTRATION. s64a-e, s65a-d, s66a-d and s67a-c are
# written and frozen TOGETHER, before any is run (the §41/§57/§62 convention).
# Design, priors, reading rules and the promotion route were frozen FIRST in
# research/specs/drafts/s64-wave-design.md (commit 0b0b08a), before any code
# in this wave existed. Dossier: research/candidates_2026-08.md.
#
# DIAGNOSTIC on data/pit/, which is EDGE-frozen by §57's own reading rule.
# These specs spend no Bonferroni budget and can enable nothing; s64/s65
# carry a pre-committed PROMOTION rule in `prior` that is the only path to
# an EDGE registration, via the audited --override-freeze supersession
# argument drafted in the wave-design doc BEFORE any run.
#
# judge_model FALSE, argued here rather than assumed: these are mechanical
# single-instrument (or three-fund) calendar/threshold switches with no
# judgeable per-trade thesis. §57 declared true for the ensemble question —
# a different question. Declaring false here is a pre-registered choice, not
# an omission.
#
# EVERY LEVERED ARM PAYS FINANCING: aux rate_bars (^IRX, a market print that
# is never revised) + 150bps, failing CLOSED to a punitive 6% flat — so no
# number here is comparable to published figures that assumed a 1% borrow.
# Shipped rails stay ON (regime cap, drawdown latch) exactly as §62 kept
# them: the candidate is measured inside the bot it would actually live in,
# and the block census reports what bound.
#
# SIZING OVERLAYS ARE IDENTICAL ACROSS ARMS (risk_per_trade 400 / position
# 400 / heat 10000): buying power is what binds, so the ONLY difference
# between baseline and a levered arm is risk.margin.multiplier — leverage is
# attributable the way §53's three-arm design made the short leg attributable.
#
# s66: vol_lever — the discretized Moreira-Muir slice. Candidate lev150.
# Pre-committed: this spec can never license an EDGE claim (see prior).
id: s66d
claim: DIAGNOSTIC
title: "vol_lever discrete vol-managed SPY (2022-2026)"

judge_model: false

snapshot:
  path: data/pit/bars_etf_2022-01-01_2026-07-10.json.gz
  sha256: d84f9ce13ee5818745d1a25ce4fbc32d558cc7cb29b268ab27c37e1841113a6d

aux:
  rate_bars:
    path: data/aux/irx_2000-01-01_2026-08-11.json.gz
    sha256: 44c3f3f580c0d61574499732dd46bea3655b92877efbc3ec343ff15d1507aade

cash: 100000.0
bonferroni_k: 15

arms:
  - name: baseline
    replace:
      symbols:
        - SPY
    set:
      strategies.ma_crossover.enabled: false
      strategies.tsmom.enabled: false
      strategies.meanrev.enabled: false
      strategies.vol_lever.enabled: true
      risk.risk_per_trade_pct: 400.0
      risk.max_position_pct: 400.0
      risk.max_portfolio_heat_pct: 10000.0
      risk.margin.multiplier: 1.0
      strategies.vol_lever.history_bars: 2520
  - name: lev150
    replace:
      symbols:
        - SPY
    set:
      strategies.ma_crossover.enabled: false
      strategies.tsmom.enabled: false
      strategies.meanrev.enabled: false
      strategies.vol_lever.enabled: true
      risk.risk_per_trade_pct: 400.0
      risk.max_position_pct: 400.0
      risk.max_portfolio_heat_pct: 10000.0
      risk.margin.multiplier: 1.5
      strategies.vol_lever.history_bars: 2520

clauses:
  - {id: a, rule: min_trades, n: 3}
  - {id: b, rule: beats_benchmark_symbol, symbol: SPY}
  - {id: d, rule: beats_benchmark_risk_adjusted, symbol: SPY}

prior: >-
  Moreira-Muir's mechanism is real and the market factor is the one place it
  survives costs (Barroso-Detzel). But Cederburg showed the real-time Sharpe
  edge mostly evaporates, and MM's own Table V shows a 1.5x cap cuts
  expected return below the unmanaged market's. Expected: clause (b) FAILS
  most periods; the drawdown behavior is the informative output. READING
  RULE across s66a-d, committed before any run: (1) THIS CANDIDATE CAN NEVER
  LICENSE AN EDGE REGISTRATION, REGARDLESS OF OUTCOME — its own literature
  predicts the total-return bar fails, and a surprise 3-of-4 pass on a
  handful of monthly switches is exactly the luck this record warns about;
  (2) candidate max_drawdown_pct at least 5pp shallower than SPY's benchmark
  drawdown in 3 or more periods AND clause (b) passing in 2 or more resolves
  'note as a possible ensemble risk-overlay', a future separately-registered
  question; (3) anything else closes the candidate. The expanding-median
  discretization is pre-committed in the module docstring; no continuous-
  weight variant may be quoted as this spec's result.

failure_modes:
  - >-
    DISCRETIZATION: the published strategy is continuous c/RV-squared; this is
    a binary hysteresis quantization. A fail here does not refute the
    continuous form and a pass does not validate it.
  - >-
    EXPANDING MEDIAN NEEDS HISTORY: history_bars 2520 in-arm; early months of
    period (a) still have thin medians and the min_history_readings floor
    holds the strategy flat — deployment will undercount the mechanism early.
  - >-
    MONTHLY SWITCHES: single-digit trades per period are expected; min_trades
    n 3 is argued from that, and a verdict on so few episodes is an episode
    count, not a distribution.
  - >-
    RAILS ON: the shipped regime cap overlaps this strategy's own mechanism
    (both delever in storms); attribution between them is via the block census
    only.
