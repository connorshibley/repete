      risk.max_portfolio_heat_pct: 10000.0
      risk.margin.multiplier: 1.5
      risk.max_drawdown_pct: 0
  - name: macro_on
    replace:
      symbols:
        - SPY
    set:
      strategies.ma_crossover.enabled: false
      strategies.tsmom.enabled: false
      strategies.meanrev.enabled: false
      strategies.trend_hold.enabled: true
      risk.risk_per_trade_pct: 400.0
      risk.max_position_pct: 400.0
      risk.max_portfolio_heat_pct: 10000.0
      risk.margin.multiplier: 1.5
      risk.max_drawdown_pct: 0
      risk.macro_gate.enabled: true
      risk.macro_gate.series: UNRATE
