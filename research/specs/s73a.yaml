# §73a — DIAGNOSTIC: macro entry gate (UNRATE) on the confirmed trend_hold
# lev150 latch-off config (2000-2006)
#
# THE SPEND THIS ANSWERS. §31 deferred macro entirely: FRED serves current
# values, and backtesting a revised series is lookahead that would quietly
# invalidate any gate scored against it. `probe_alfred_vintages.py` was
# written to close that deferral before any macro code was trusted, and on
# 2026-08-12 it PASSED all three checks against a real key (vintage axis
# exists, revisions actually diverge from a market-rate negative control,
# release lag postdates the observation period) — see
# `research/alfred_vintages_2026-08-12.txt`. This is the first spec that
# spends that clearance.
#
# WHAT IS BEING TESTED. `risk.macro_gate` (built in §64, shipped disabled)
# blocks an ENTRY when a configured series' latest as-of value sits above its
# own trailing mean — UNRATE, first-print-only, in `data/aux/unrate_*.json.gz`
# (`scripts/build_macro_aux.py`). It is JUDGE-CONTEXT SHAPED by construction:
# fails open, ts-bounded, never touches an exit, can only REMOVE an entry the
# price signal already wanted to take — the same four properties
# `credit_blocked` pinned. The candidate here is the config §72 already
# confirmed EDGE on (trend_hold, latch OFF, 1.5x financed leverage) with the
# gate turned on, so the question is narrow and honest: does macro
# regime-filtering improve the ALREADY-WINNING configuration, or does a
# lagging indicator applied on top of a strategy whose own 200-DMA signal
# already times regime cost it trades it needed?
#
# DIAGNOSTIC; K STAYS 16 (the value §72 advanced it to). This spends no
# Bonferroni budget and licenses no enablement — CLAUDE.md invariant 2, same
# as every prior wave.
