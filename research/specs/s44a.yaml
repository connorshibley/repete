# §44a — DECAY + REDUCED SIZING: DOES RETURN IMPROVE AT MATCHED DRAWDOWN? (2000-2006)
#
# ONE CLAIM IN FOUR FILES, same convention §41 used: s44a-d are written and
# frozen TOGETHER, before any of them is run. Conjunction — one failure sinks
# the claim. Running one period and reporting it would be period selection.
#
# THE PRIOR CLAIM THIS FOLLOWS. §41 (knowledge/backtest_candidates.md:3850)
# tested risk.decayed_peak — the drawdown-circuit-breaker latch decaying toward
# equity after a grace period, instead of never re-closing — at UNCHANGED
# sizing (risk_per_trade_pct: 8.0, the §29-adopted value). REJECTED: the decay
# arm roughly doubled maxDD in three of four periods (11.51->17.67,
# 12.04->21.15, 10.78->15.73; 2014-2019 was a flagged anomaly, identical maxDD
# both arms because the latch barely operated there). §41's own text named the
# legitimate follow-up: "pair the decay with reduced per-trade sizing and ask
# whether return improves at matched drawdown... requiring a fresh
# registration citing this rejection in its prior... the owner's decision to
# make, not an automatic next step." This spec is that follow-up, registered
# only after the owner made that decision (2026-08-01).
#
# THE SIZING VALUE, DERIVED NOT TUNED. 5.0, from risk_per_trade_pct: 8.0
# scaled by the AVERAGE of §41's own three non-anomalous maxDD ratios
# (baseline/decay): 11.51/17.67=0.651, 12.04/21.15=0.569, 10.78/15.73=0.685,
# mean 0.635 -> 8.0*0.635=5.08, rounded to 5.0. This uses ONLY numbers §41
# already published before this spec existed; s44a-d have not been run. It is
# one arm, not a sweep — §34 already showed selecting the best of several
# settings after seeing results does not predict anything on this data, and
# choosing among sizing values here would be the same mistake.
#
# WHY THIS IS EDGE, NOT CAPACITY LIKE §41. §41 deliberately excluded return as
# a clause ("Return is not evidence here"), because more deployment alone
# inflates return without meaning anything. This spec's clause (b) is
# `beats_exposure_matched` — return judged AGAINST the deployment level
# achieved, the same standard every enablement gate in this repo uses. That
# makes a PASS here an actual EDGE claim, scored against the same 0-for-12
# record as every other one.
id: s44a
claim: EDGE
title: "Decay + reduced sizing: does return improve at matched drawdown? (2000-2006)"

# §41 was scored judge-less — §45 named this as an open gap ("whether the
# decay arm still roughly doubles maxDD with the judge on is unmeasured").
# This spec closes that gap rather than repeating it: judge ON, matching what
# live actually runs. That also means §44's numbers are NOT directly
# comparable to §41's own table — different simulator fidelity, not just a
# different arm — and this spec should be read on its own clauses, not by
# diffing its maxDD figures against §41's.
judge_model: true

snapshot:
  path: data/snapshots/bars_wide_2000-01-01_2006-12-31.json.gz
  sha256: 432cec564ccee6abcf690d365b51cfd107b8b734c2375b8638ff4cadb5251cc8

cash: 100000.0

# K=13. Twelve claims precede this one in the shared multiple-comparisons
# count (§41 CAPACITY took 11, §43 EDGE took 12) — the count rises by one for
# this whole conjunction, not by four, same reasoning §41 and §37 used.
bonferroni_k: 13

# NO shared block, NO overlay — the subject is the SHIPPED configuration, same
# as §41, for the same reason: §40 had to correct the record once already when
# an imposed common profile turned out to describe a different bot than the
# one that shipped.
arms:
  - name: baseline

  - name: decay_reduced_sizing
    set:
      risk.drawdown_decay.enabled: true
      risk.drawdown_decay.grace_bars: 10
      risk.drawdown_decay.halflife_bars: 20
      risk.risk_per_trade_pct: 5.0

clauses:
  # Matched drawdown — the actual test this claim is named for. Same 3.0pp
  # allowance §41 used, for direct comparability between the two claims.
  - {id: a, rule: maxdd_within, pp: 3.0}

  # THE EDGE CLAUSE. Return must beat what the deployment level alone would
  # predict — not just "not worse", an actual claim of value creation.
  - {id: b, rule: beats_exposure_matched}

  # Without this a two-trade arm could clear the rest on noise.
  - {id: c, rule: min_trades, n: 30}

  # Per-trade quality: did reduced sizing at higher deployment still produce
  # trades at least as good as baseline's, or did it buy trade count with
  # worse average trades.
  - {id: d, rule: not_worse}

prior: >-
  EDGE claims stand at 0 for 12 going into this registration, and §41 already
  showed the decay mechanism roughly doubles maxDD at unchanged sizing — the
  honest base rate here is REJECTED, most likely on (b). Reducing sizing to
  bring drawdown back toward baseline mechanically shrinks the very deployment
  that would be needed to generate return in excess of the exposure-matched
  benchmark; the two clauses pull in opposite directions by construction, and
  that tension, not a data quirk, is the most likely failure. If (a) fails
  instead, it says the derived value of 5.0 was not conservative enough even
  for matched drawdown in this period, which would call for revisiting the
  sizing derivation in a fresh registration rather than re-scoring this one.
  A PASS on all four would be the first EDGE claim this project has ever
  produced, and should be treated with the corresponding amount of scrutiny
  before anything is enabled, not less.

failure_modes:
  - >-
    SURVIVORSHIP, inherited from §41: today's index membership is used to
    build the universe, so 2000-2006 excludes dot-com-era failures by
    construction. This flatters any long strategy, and flatters the higher-
    deployment arm more than baseline.
  - >-
    5.0 is a mean across three periods, not a per-period optimum — it will
    over-correct drawdown in some periods and under-correct in others by
    construction. A PASS or FAIL in any single period says something about
    THIS specific derived value, not about decay+reduced-sizing in general.
  - >-
    §41 flagged 2014-2019 as anomalous (maxDD identical across arms because
    the latch barely operated there, drawdown only 20.65% of blocks). If s44c
    shows the same pattern, clause (a) may pass there for reasons unrelated to
    the mechanism under test — a PASS there is weaker evidence than a PASS
    elsewhere, exactly as §41 noted for its own clause (d).
  - >-
    Even with `beats_exposure_matched` stripping out the raw-deployment
    confound, a period whose market rose broadly still helps any strategy that
    is net long more of the time. This clause is the correction for that, not
    a guarantee against it.
  - >-
    A PASS on all four does not mean the bot should trade live at these
    settings — it means one candidate fix to the one-way latch, at one
    specific derived sizing value, cleared four pre-registered bars on
    historical data. The 30-closed-trade live evidence gate (§47's own
    denominator) is untouched.
