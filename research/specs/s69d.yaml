# §69d — tom_tilt lev150 latch-off vs latch-on (2022-2026)
#
# THE LATCH WAVE — FIFTEEN SPECS IN ONE REGISTRATION (s68-s71), owner-directed
# 2026-08-12 after §64-§67: "rerun with the latch declared per-arm." The §64
# finding was that risk.max_drawdown_pct (the drawdown circuit breaker, built
# for a 38-name book) is a one-way trapdoor for a single-symbol full-equity
# strategy: 869 of 876 signals blocked, and a cash book can never recover its
# high-water mark. §64-§67 closed the candidates AS WIRED; this wave asks the
# question those verdicts could not: the MECHANISM, latch declared OFF in the
# candidate arm, latch-on identical twin as baseline — so the latch's whole
# cost is the arm difference, the §53 attribution pattern. §53's precedent is
# honored, not dodged: this is the "different experiment needing its own
# pre-registration", registered before any run. For s71/gem specifically, the
# §67 closure stands for GEM-as-wired; the OWNER'S explicit instruction is
# what reopens the mechanism question here, and this header is that record.
# DIAGNOSTIC; K stays 15. judge_model false (the §64 argument, unchanged).
# Every levered arm pays ^IRX+150bps financing, fail-closed 6%.
