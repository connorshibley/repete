# §73d — DIAGNOSTIC: macro entry gate (UNRATE) on the confirmed trend_hold
# lev150 latch-off config (2022-2026)
#
# See s73a for the full design rationale. This period carries a real data
# caveat, named directly in the prior below rather than left implicit: the
# 2025 federal shutdown left a genuine gap in the underlying release
# cadence, and `scripts/build_macro_aux.py` forward-filled through it rather
# than papering over it silently.
id: s73d
claim: DIAGNOSTIC
title: "macro entry gate (UNRATE) on trend_hold lev150 latch-off (2022-2026)"

judge_model: false

snapshot:
  path: data/pit/bars_etf_2022-01-01_2026-07-10.json.gz
  sha256: d84f9ce13ee5818745d1a25ce4fbc32d558cc7cb29b268ab27c37e1841113a6d

