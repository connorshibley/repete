  DETERMINISTIC RE-SCORING of s68's exact configuration - same snapshots,
  same arms, same clauses - because the claim being made is the one already
  measured, now carried at EDGE weight with the Bonferroni column advanced.
  Any numeric divergence from s68 voids the promotion (nondeterminism).
  READING RULE, frozen: (b) passing on latch_off in the same 3 periods and
  failing 2014-2019 CONFIRMS the claim at K=16 - the EDGE tally becomes 2
  passes in 16, the first on survivorship-clean data with financed leverage;
  any other pattern VOIDS the promotion and re-freezes this venue. Either
  way the venue re-freezes after this registration: the licence was for one
  spend. A confirmed EDGE is an evidence bundle for an owner conversation
  about risk design (a latchless single-symbol book has no drawdown brake) -
  it is NOT an enablement and licenses no config change.

failure_modes:
