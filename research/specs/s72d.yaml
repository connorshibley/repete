    by these specs.
  - >-
    REMAINING RAILS STAY ON (regime cap, daily loss limit); the arm difference
    isolates the latch only.
  - >-
    FEW INDEPENDENT EPISODES: same s48/s49 caveat as the first wave; four
    periods of regime switches are a handful of bets.
  - >-
    GAP-THROUGH and financing realism carry over from s64 verbatim.
