# §73c — DIAGNOSTIC: macro entry gate (UNRATE) on the confirmed trend_hold
# lev150 latch-off config (2014-2019)
#
# See s73a for the full design rationale. This is the wave's sanity-check
# period: a sustained expansion with unemployment falling almost
# monotonically, where the gate's own trigger condition should rarely fire.
