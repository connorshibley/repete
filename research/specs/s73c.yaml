  - {id: c, rule: beats_benchmark_symbol, symbol: SPY}
  - {id: d, rule: beats_benchmark_risk_adjusted, symbol: SPY}

prior: >-
  Unemployment fell essentially monotonically the entire window — roughly
  6.7% (Jan 2014) to 3.5% (Dec 2019) — so the gate's own trigger condition
  (latest as-of value above its trailing mean) should rarely or never
  engage in a sustained downtrend. PREDICT: the two arms are NEAR-IDENTICAL
  here, functioning as this wave's check that the gate is inert when there
  is no macro deterioration to flag rather than firing on noise. Recall
  baseline itself already LOST to SPY in this exact window per s72c's
  frozen and confirmed prior — this period cannot license a promotion on
  its own even if the arms tie, and a tie here is the expected, uninformative
  result, not evidence for or against the mechanism.

  READING RULE — identical to s73a/s73b; this period's most likely
  contribution is a tie that neither helps nor sinks the 3-of-4 count on
  its own.

failure_modes:
  - >-
    THE GATE CAN ONLY REMOVE, NEVER ADD, an entry — see s73a.
  - >-
    A TIE HERE IS EXPECTED AND UNINFORMATIVE, not a pass earned on merit —
    read alongside the fact that baseline already loses to SPY in this
    window regardless of the gate.
  - >-
    FEW INDEPENDENT EPISODES: same s48/s49 caveat as every prior wave.
  - >-
    LATCH OFF IS NOT SHIPPABLE AS-IS, REMAINING RAILS STAY ON, and
    GAP-THROUGH/financing realism carry over from s64/s68/s72 verbatim.
  - >-
    THE AUX IS A MON-FRI STEP SERIES, NOT A TRUE NYSE CALENDAR — see s73a.
