prior: "I EXPECT §72's PASS TO DEGRADE, AND I NAME THE CLAUSE AND THE PERIODS BEFORE\n\
  RUNNING. §60 measured that this project's 55 priors carried no information —\n\
  every one said \"fail\" — so a prior earns its place only by committing a\nspecific,\
  \ falsifiable pattern.\n\nThe judge is the only lever that matters. The CORRECTED\
  \ calibration (mean\nscale 0.595, veto 4.4%) is roughly a 40% position haircut\
  \ on a levered\nlong-only trend follower whose return scales near-linearly with\
  \ exposure.\n§72's margins over SPY on clause (b) were +41.75pp (2000-06), +3.78pp\n\
  (2007-13) and +8.51pp (2022-26); it already lost 2014-19 by 27.42pp. A 40%\nhaircut\
  \ on +55.08% and +75.57% erases the second and third margins with\nroom to spare;\
  \ it does not erase +51.76% vs +10.01%.\n\nSO: I predict clause (b) on latch_off\
  \ SURVIVES in 2000-2006 and FAILS in\n2007-2013, 2014-2019 and 2022-2026 — taking\
  \ the tally from 3-of-4 to\n1-of-4. Under the frozen reading rule below that is\
  \ the \"substantially an\nartifact\" branch, and I commit to that reading now.\n\
  \nSlippage decides nothing, and I say so before seeing it: ~0.8pp in §72's\nFAVOUR\
  \ against margins of 8.5-41.8pp. If a number improves, the cause is\nalready named\
  \ and cannot be claimed as new evidence.\n\nTWO THINGS I DO NOT KNOW. (1) Clause\
  \ (d) is risk-MATCHED: the judge shrinks\ndrawdown as well as return and the scale\
  \ factor partly compensates. (d) may\nsurvive where (b) dies; I cannot sign that\
  \ in advance. (2) s72d cleared\nmin_trades by exactly zero (8 vs 8). Whole-share\
  \ truncation under a 40%\nhaircut (judge_model.py zeroed) could fail clause (a)\
  \ on arithmetic before\nany return question is asked.\n\nREADING RULE, FROZEN\
  \ BEFORE ANY RUN, across s75a-d together, on clause (b),\nlatch_off arm — the\
  \ clause §72's own promotion rule was written in:\n\n  3 of 4, failing 2014-2019\
  \ and ONLY 2014-2019 — the same pattern §72\n    recorded. §72 SURVIVES its two\
  \ known measurement gaps. This licenses\n    NOTHING FURTHER: no enablement, no\
  \ config change, no new EDGE\n    registration; the venue stays frozen. A METHOD\
  \ pass removes a doubt; it\n    adds no evidence.\n\n  2 of 4, or 3 of 4 with\
  \ a DIFFERENT period failing — §72's pass is\n    REGIME-CONTINGENT ON THE MEASUREMENT.\
  \ Annotate: knowledge/\n    backtest_candidates.md §72, GLOSSARY.md's \"first\
  \ on survivorship-\n    certified data\", README.md's \"2 passes in 16\", and\
  \ bot-pre-registration/\n    SKILL.md each get a pointer here. The tally line\
  \ becomes \"2 passes in\n    16, one of which does not survive re-measurement\
  \ with the judge on.\"\n\n  1 or fewer of 4 — §72's pass was IN SUBSTANTIAL PART\
  \ an artifact of a\n    judge-less, flat-cost measurement. Same annotations, and\
  \ the §72\n    headline is SUPERSEDED rather than footnoted. K does NOT move:\
  \ a\n    withdrawn pass does not refund budget.\n\nIn every branch this spends\
  \ no K, enables nothing, and is not an EDGE claim."
failure_modes:
- THE CALIBRATION IS OFF-DISTRIBUTION, AND THIS IS THE SHARPEST RISK. Its 250 judged
  buys come from the shipped 38-name ensemble book on individual megacaps over 34
  days in Jul-Aug 2026. This applies that marginal distribution to a SPY-only 200-DMA
  switch at 1.5x over 2000-2026. The judge never saw a signal of this shape; exchangeability
  is assumed and probably false. A FAIL reads as '§72 does not survive THE JUDGE
  AS CALIBRATED', not '§72 is refuted' — that distinction must survive into the
  write-up.
- 'A DISTRIBUTION IS NOT A REPLAY. judge_model.py cannot recover WHICH trades the
  judge would have cut; nothing can, retroactively. #14 and #15 stay OPEN. Judge-on
  NARROWS divergence #8 and may not be written up as closing it.'
- 'THE MEASURED SLIPPAGE IS A PAPER-BROKER NUMBER: 30 clean fills over one month
  under mode: paper, largely measuring a fill model that quotes and fills at the
  same price. It contains no market impact because there is none to contain. Included
  because it is the repo''s own estimator at its own defaults, not because it is
  known to be right.'
- THE BASE CONFIG IS NOT IN THE FROZEN HASH (bt.load_config reads config.yaml from
  CWD). Comparability rests on the CONTROL run above, not on any check the apparatus
  performs. Standing hole, recorded here where it binds most.
- A METHOD FAIL IS NOT AN EDGE CLAIM IN REVERSE. If latch_off degrades that is not
  evidence that latch_on (the baseline arm) is good or that any config should change.
  The baseline arm exists only to hold §72's comparison shape fixed.
- 'FEW INDEPENDENT EPISODES: four periods of regime switches are a handful of bets
  and re-measuring them creates no new ones. Latch-off is not shippable as-is; remaining
  rails stay on; gap-through and financing realism carry over from s64/s68/s72 verbatim.'
