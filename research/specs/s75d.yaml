# §75d — METHOD: does §72's EDGE pass survive its own known measurement gaps?
#         (2022-2026)
#
# NOT AN EDGE CLAIM AND CANNOT BECOME ONE. §72's venue re-froze with its own
# spend. This asserts no new edge. It re-executes §72's frozen pass mark,
# byte-for-byte, on §72's frozen snapshot, with §72's arms character for
# character — changing ONLY how the measurement is taken. Its asymmetry is the
# opposite of an EDGE claim's: it can only WITHDRAW support from §72, never add
# any. Hence no Bonferroni spend and no --override-freeze: freeze_violation()
# returns None for a non-EDGE claim before the path is read
# (register_gate.py:160, pinned both ways by tests/test_edge_freeze.py:143-148).
#
# THE FIRST METHOD CLAIM IN THIS PROJECT: 102 registrations are 76 DIAGNOSTIC,
# 22 EDGE, 4 CAPACITY, 0 METHOD. DIAGNOSTIC was rejected for this question
# because run_gate.py prints that a DIAGNOSTIC "decides NOTHING ... cannot
# enable, reject or support anything", and this must be able to withdraw
# support from §72. METHOD — "is the way we are measuring sound?" — is the
# only fit.
#
# CONTROL RAN FIRST (2026-08-22, this checkout, main @ 86f28f1): s72a-d
# re-executed unchanged. Zero drifted fields across every arm. §72
# reproduces byte-for-byte, so config.yaml — which is NOT in the spec hash —
# has moved nothing load-bearing since 2026-08-12, and this comparison holds.
#
# GAP 1 CLOSED — the judge (divergence #8). §72 ran judge_model: false. This
#   runs it ON, against knowledge/judge_calibration.json at sha
#   c19b2ab9adbfed7d5e4f5d8a97f8b51635ea0072a7861d6885b3bc4f0f578e21 —
#   the CORRECTED calibration (PR #133): n=250, mean_scale 0.595188, veto
#   0.044, downsize 0.858, 51 degraded rows excluded, observed to 2026-08-19.
#   Named here because the calibration is referenced by NO other spec and is
#   not in the hash; this is the first verdict in the project pinned to its
#   calibration. A ~40% position haircut — larger than the ~27% the
#   pre-correction file implied, because 22% of its sample was fallbacks.
#   THIS IS THE ONLY LEVER WITH THE SIZE TO FLIP A CLAUSE.
# GAP 2 CLOSED — the cost model. §72 scored at the flat 5 bps default.
#   backtest.measured_slippage_bps() at shipped defaults (min_fills=10,
#   sane_bps=100) over the live ledger returns 1.55 bps: 30 clean of 41
#   fill_quality rows, 2026-07-16..2026-08-17, ledger sha256
#   9a23fcfb85071061d86ddb6b6e1bd36a7c493799ac208bef395682e70715a0c0.
#   Frozen as a LITERAL on purpose: memory/ is gitignored and appends daily,
#   so a runner reading it live would score the same frozen spec differently
#   on different days. Direction stated honestly: 1.55 < 5 makes the backtest
#   CHEAPER and is FAVOURABLE to §72; at 8-17 round trips it moves ~0.8pp
#   against margins of 8.5-41.8pp, and SPY is charged the same number
#   (backtest.py benchmark_stats). Included for completeness; it cannot
#   decide anything, and saying so in advance is the point.
# GAP 3 IS NOT A GAP HERE — the earnings blackout (#19). Deliberately NOT
#   supplied, with proof: this universe is 13-15 ETFs with no earnings dates;
#   the guard at backtest.py reads earnings_blackout_days from the STRATEGY's
#   params and only tsmom carries that key; §72 disables tsmom and
#   trend_hold has no such key. Supplying an earnings aux would change
#   nothing while implying a gap was shut. Adding the key to trend_hold would
#   model a filter live does not apply — a fabricated divergence.
#
# STILL OPEN and not closed here: #14, #15 (the live judge reads news memory
# and principles; this model replays a marginal distribution, not a judge —
# judge_model.py:19-23), plus #13, #16, #18, #21. Judge-on NARROWS #8. It does
# not close it, and no verdict here may be written up as closing it.
