# WHY THIS FILE EXISTS (W4-1, 2026-07-29)
# ---------------------------------------
# This project's entire method is hash-frozen determinism: snapshots pinned by
# sha256, pre-registrations frozen by canonical hash, and gate re-runs REQUIRED
# to reproduce byte-identically (tests/test_run_gate_reproduces.py). All of that
# sat on top of three requirements files that were `>=` with ZERO `==`.
#
# The exposure is not hypothetical. `numpy` and `pandas` arrive here as
# TRANSITIVE dependencies — nothing named them — and a change in the last place
# of a float is enough to move a profit factor across the 1.3 enablement
# threshold. A verdict that cannot be reproduced is not a verdict, and nothing
# in the repo would have caught the drift.
#
# THE RULE: bumping any pin is a change that must be followed by re-running at
# least one frozen gate and confirming the recorded numbers still reproduce. If
# they do not, that is a FINDING for knowledge/backtest_candidates.md — not
# something to fix by reverting the pin until the old number comes back.
#
