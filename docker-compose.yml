# Always-on agent (2026-07-22). Secrets come from .env on the HOST — the
# file is never copied into the image and stays out of git.
#
#   docker compose up -d          # run the scheduler forever
#   docker compose run --rm agent python src/main.py     # one cycle
#   docker compose run --rm agent python src/health.py   # status
services:
  agent:
    # BOTH networks, explicitly. A service with no `networks:` key joins
    # `default` ONLY — declaring ollama-net at the bottom of this file does not
    # attach anything to it. That asymmetry is easy to miss and fails silently:
    # the container starts, `vllm-qwen38` does not resolve, and the judge
    # degrades on every call.
    networks: [default, ollama-net]
    build:
      context: .
      args:
        # Stamps the running commit into the image so the drift guard can name
        # WHICH build is trading (§26 divergence #7 — production ran 57 commits
        # stale for three days and nothing noticed). deploy/deploy.sh exports
        # this; an empty value degrades the guard to config-drift only.
        GIT_SHA: ${GIT_SHA:-}
        # Bakes the agent user to the host's own uid/gid (Dockerfile) so it
        # can read a bind-mounted deploy_key without that key needing to be
        # world-readable, and can still write everywhere in /app that a
        # uid-10001-owned image normally could. deploy/deploy.sh exports
        # these from `id -u`/`id -g`; unset on any host without a
        # deploy_key mount, which keeps the image's original uid 10001.
        HOST_UID: ${HOST_UID:-10001}
        HOST_GID: ${HOST_GID:-10001}
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: America/New_York
    volumes:
      # State is a volume, not image content: the audit trail must survive
      # every rebuild and redeploy.
      - ./memory:/app/memory
      - ./logs:/app/logs
      # Backups too — scripts/backup.sh writes here nightly and the weekly
      # restore drill reads it. Without this mount the archives live in the
      # container's ephemeral layer and vanish on every rebuild/redeploy,
      # defeating the "a backup that has never been restored is a hope" goal.
      - ./backups:/app/backups
      # deploy/README.md documents this mount ("push credentials mounted at
      # /app/.site") but nothing here ever actually defined it — so on any
      # host that followed only this file, scripts/publish_dashboard.sh's own
      # `[ -d .site/.git ] || exit 0` made publishing a silent, permanent
      # no-op. The host is responsible for the checkout and its push
      # credentials (never baked into the image); this just wires the mount
      # the docs already promised.
      - ./.site:/app/.site
      # The push credential itself: a deploy key scoped to write-access on
      # ONLY repete-dashboard (not a personal token with account-wide
      # scope). .site/.git/config's core.sshCommand points at this exact
      # path. Read-only — the container never needs to write it.
      - ./deploy_key:/app/deploy_key:ro
    healthcheck:
      test: ["CMD", "python", "src/health.py"]
      interval: 5m
      timeout: 30s
      start_period: 1m
      retries: 2

  # Publisher (Phase B): read-only against memory/, own state volume.
  #   docker compose --profile publisher up -d
  publisher:
    build: .
    profiles: ["publisher"]
    restart: unless-stopped
    env_file: .env
    command: >
      sh -c "pip install --no-cache-dir -r requirements-publisher.txt &&
             uvicorn publisher.app:app --host 0.0.0.0 --port 8080"
    ports: ["8080:8080"]
    volumes:
      - ./memory:/app/memory:ro        # READ-ONLY mount — invariant #9 at
                                       # the filesystem level, not just code
      - ./publisher_data:/app/publisher_data
      - ./requirements-publisher.txt:/app/requirements-publisher.txt:ro
      - ./publisher:/app/publisher:ro

# The vLLM containers (qwen3.8-27b, and a small router model) and LiteLLM all
# sit on `ollama-net`, created outside this file by whoever brought that stack
# up. Joining it lets the agent reach http://vllm-qwen38:8000/v1 directly —
# no published port, no API key, nothing leaving the host.
#
# EXTERNAL on purpose: this compose file must not own, create or destroy a
# network another stack depends on. `docker compose down` here would otherwise
# take the model server's network with it.
#
# Inert while llm.provider is `anthropic`. Joining a network is not using it.
networks:
  default:
  ollama-net:
    external: true
